const note=(f,t,d,v)=>{const o=A.createOscillator(),g=A.createGain();o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+d*.3);g.gain.linearRampToValueAtTime(0,t+d);o.connect(g);g.connect(M);o.start(t);o.stop(t+d)};
const bar=()=>{const t=A.currentTime,c=ch[n++%4];c.forEach(f=>note(f,t,4.4,.16));note(c[0]/2,t,4.4,.2);for(let k=0;k<4;k++)note(pn[Math.floor(Math.random()*5)],t+k,1.6,.05)};
bar();setInterval(bar,4000)}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function say(t){const min=wait(t.length*55+1500);
if(muted||!ss)return Promise.all([wait(t.length*70),min]);
const sp=new Promise(r=>{const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';if(vc)u.voice=vc;u.rate=.94;u.onend=u.onerror=r;ss.speak(u)});
return Promise.all([Promise.race([sp,wait(t.length*90+3000)]),min])}
async function play(){const id=++run;if(ss)ss.cancel();$('.cr').classList.remove('on');$('.go').classList.add('h');st.classList.add('play');if(!A)music();
for(let i=0;i<S.length;i++){if(id!==run)return;sc.forEach((e,j)=>e.classList.toggle('on',j===i));sweep();whoosh();$('.bar').style.width=(i+1)/S.length*100+'%';
if(!i){try{$('#pm').beginElement()}catch(e){}}
await wait(1300);vol(.035);await say(S[i].v||S[i].p);vol(.07);await wait(900)}
if(id===run)$('.cr').classList.add('on')}
$('#go').onclick=play;$('#re').onclick=play;
$('#m').onclick=()=>{muted=!muted;$('#m').textContent=muted?'🔇':'🔊';if(M){M.gain.cancelScheduledValues(A.currentTime);M.gain.value=muted?0:.07}if(muted&&ss)ss.cancel()};
const sw=document.createElement('div');sw.className='sw';st.append(sw);
['t','b'].forEach(c=>{const e=document.createElement('div');e.className='lb '+c;st.append(e)});
function sweep(){sw.classList.remove('run');void sw.offsetWidth;sw.classList.add('run')}
function whoosh(){if(!A||muted)return;const t=A.currentTime,b=A.createBuffer(1,A.sampleRate*1.4,A.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=A.createBufferSource(),f=A.createBiquadFilter(),g=A.createGain();s.buffer=b;f.type='bandpass';f.Q.value=.8;f.frequency.setValueAtTime(300,t);f.frequency.exponentialRampToValueAtTime(3200,t+1.1);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.05,t+.5);g.gain.linearRampToValueAtTime(0,t+1.3);s.connect(f);f.connect(g);g.connect(A.destination);s.start(t)}
const cv=document.createElement('canvas');cv.className='fx';st.append(cv);const cx=cv.getContext('2d'),P=[];
const rs=()=>{cv.width=st.clientWidth;cv.height=st.clientHeight};rs();addEventListener('resize',rs);
for(let i=0;i<46;i++)P.push({x:Math.random(),y:Math.random(),r:2+Math.random()*7,s:.02+Math.random()*.05,a:.15+Math.random()*.35,p:Math.random()*6});
(function f(t){cx.clearRect(0,0,cv.width,cv.height);P.forEach(o=>{o.y-=o.s/60;o.x+=Math.sin(t/3000+o.p)*.0002;if(o.y<-.05)o.y=1.05;const X=o.x*cv.width,Y=o.y*cv.height,R=o.r*(cv.height/700+.5)*3,g=cx.createRadialGradient(X,Y,0,X,Y,R);g.addColorStop(0,`rgba(255,226,170,${o.a*(.6+.4*Math.sin(t/900+o.p))})`);g.addColorStop(1,'rgba(255,226,170,0)');cx.fillStyle=g;cx.beginPath();cx.arc(X,Y,R,0,7);cx.fill()});requestAnimationFrame(f)})(0);
const ps=document.querySelector('.ps svg'),fit=()=>ps.setAttribute('preserveAspectRatio',innerWidth<innerHeight?'xMidYMid meet':'xMidYMid slice');fit();addEventListener('resize',fit);
</script></body></html>
